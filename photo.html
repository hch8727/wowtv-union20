<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>사진 이벤트 | 한국경제TV노조출석부</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root{--ink:#00538E;--accent:#1EC2F2;--accent-deep:#0E8FBE;--line:#d6e3ee;--muted:#5f7387;--bg:#f2f7fb;--err:#b42318;
        box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
  *,*::before,*::after{box-sizing:inherit}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;-webkit-font-smoothing:antialiased}
  header{background:#fff;border-bottom:1px solid var(--line);padding:14px 18px;display:flex;align-items:center;gap:12px;position:sticky;top:env(safe-area-inset-top,0px);z-index:3}
  header img{max-height:26px;width:auto}
  header h1{font-size:16px;margin:0;flex:1}
  header .me{font-size:13px;color:var(--muted)}
  main{max-width:560px;margin:0 auto;padding:16px}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
  button{font:inherit;cursor:pointer;border:0;border-radius:12px}
  .primary{width:100%;padding:16px;font-size:17px;font-weight:700;background:var(--ink);color:#fff}
  .primary:disabled{opacity:.5}
  .ghost{background:transparent;color:var(--muted);font-size:13px;padding:6px 10px}
  input[type=text]{width:100%;font:inherit;font-size:16px;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;margin-top:10px}
  .notice{font-size:12px;color:var(--muted);line-height:1.6;margin:10px 0 0}
  .msg{font-size:14px;min-height:1.4em;margin-top:8px}.msg.err{color:var(--err)}
  .prog{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:12px;display:none}
  .prog i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}
  /* 미리보기 */
  .pick{display:flex;gap:12px;align-items:center}
  .pick .thumb{width:96px;height:96px;border-radius:12px;background:#eef3f8 center/cover no-repeat;flex:none;display:grid;place-items:center;color:var(--muted);font-size:12px}
  .pick label{flex:1;display:grid;place-items:center;height:96px;border:2px dashed var(--line);border-radius:12px;color:var(--accent-deep);font-weight:600;cursor:pointer}
  .pick input{display:none}
  /* 갤러리 */
  h2{font-size:15px;margin:22px 0 10px;display:flex;justify-content:space-between;align-items:center}
  h2 small{font-weight:500;color:var(--muted)}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .ph{position:relative;border-radius:12px;overflow:hidden;background:#dfe8f0;aspect-ratio:1}
  .ph img{width:100%;height:100%;object-fit:cover;display:block}
  .ph .cap{position:absolute;left:0;right:0;bottom:0;padding:26px 10px 8px;font-size:12px;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.6));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ph .like{position:absolute;right:8px;top:8px;background:rgba(255,255,255,.92);border-radius:999px;padding:6px 10px;font-size:13px;font-weight:700;color:var(--ink);display:flex;gap:4px;align-items:center}
  .ph .like.on{background:var(--accent);color:#fff}
  .ph .like svg{width:16px;height:16px}
  .ph.mine::after{content:"내 사진";position:absolute;left:8px;top:8px;background:var(--ink);color:#fff;font-size:11px;padding:3px 8px;border-radius:999px}
  .ph .del{position:absolute;left:8px;bottom:36px;background:rgba(180,35,24,.9);color:#fff;font-size:11px;padding:4px 8px;border-radius:999px}
  /* 전체보기 */
  #view{position:fixed;inset:0;background:rgba(0,20,40,.96);display:none;flex-direction:column;z-index:9}
  #view.on{display:flex}
  #view img{flex:1;min-height:0;object-fit:contain;width:100%}
  #view .bar{display:flex;align-items:center;gap:12px;padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));color:#fff}
  #view .bar .t{flex:1;font-size:14px}
  #view .bar .t b{display:block;font-size:12px;color:#8FE3FF;font-weight:500}
  #view .lk{background:#fff;color:var(--ink);padding:12px 18px;font-weight:700;font-size:15px;display:flex;gap:6px;align-items:center}
  #view .lk.on{background:var(--accent);color:#fff}
  #view .x{position:absolute;right:12px;top:calc(12px + env(safe-area-inset-top,0px));color:#fff;background:rgba(255,255,255,.15);width:38px;height:38px;border-radius:50%;font-size:20px}
  /* 미등록 */
  #gate{text-align:center;padding:40px 20px}
  #gate p{color:var(--muted);line-height:1.6}
  #gate a{display:inline-block;margin-top:12px;background:var(--ink);color:#fff;text-decoration:none;padding:14px 22px;border-radius:12px;font-weight:700}
  .toast{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:10px;font-size:14px;display:none;z-index:10}
</style>
</head>
<body>
<header>
  <img src="https://img.wowtv.co.kr/PcStyle/images/ir/logo.png" alt="한국경제TV">
  <h1>사진 이벤트</h1>
  <span class="me" id="me"></span>
</header>

<main>
  <section id="gate" style="display:none">
    <p>출석 등록 후 사진 이벤트에 참여할 수 있습니다.<br>먼저 출석해 주세요.</p>
    <a href="checkin.html">출석하러 가기</a>
  </section>

  <section id="app" style="display:none">
    <div class="card" id="upCard">
      <div class="pick">
        <div class="thumb" id="thumb">미리보기</div>
        <label><input type="file" id="file" accept="image/*">사진 선택 / 촬영</label>
      </div>
      <input type="text" id="cap" maxlength="40" placeholder="한 줄 설명 (선택)">
      <button class="primary" id="btnUp" disabled style="margin-top:12px">사진 올리기</button>
      <div class="prog" id="prog"><i></i></div>
      <div class="msg" id="msg"></div>
      <p class="notice">1인 최대 3장. 올린 사진은 행사 화면에 공개되며 종료 후 삭제됩니다. <span id="quota"></span></p>
    </div>

    <h2>모두의 사진 <small id="cnt"></small></h2>
    <div class="grid" id="grid"></div>
  </section>
</main>

<div id="view"><button class="x" id="vx">✕</button><img id="vimg" alt=""><div class="bar"><div class="t" id="vt"></div><button class="lk" id="vlike"></button></div></div>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL = 'https://pmpifokwmrkqrmumycjx.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBtcGlmb2t3bXJrcXJtdW15Y2p4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIxNTQ0ODcsImV4cCI6MjEwNzczMDQ4N30.e4x2eWP33EyTq9_GoAyL9M8WXSzhMKeUdKv6RRLRScY';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const HEART = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-7.5-4.6-9.6-9.3C1 8.3 3.2 5 6.6 5c1.9 0 3.4 1 4.4 2.4C12 6 13.5 5 15.4 5c3.4 0 5.6 3.3 4.2 6.7C19.5 16.4 12 21 12 21z"/></svg>';
const url = p => sb.storage.from('photos').getPublicUrl(p).data.publicUrl;
function toast(t){ const el = $('toast'); el.textContent = t; el.style.display = 'block'; clearTimeout(el._t); el._t = setTimeout(() => el.style.display = 'none', 2600); }

let TOK = null, ME = null, photos = [], mine = new Set(), liked = new Set(), showCount = false, voteOpen = true, blob = null, cur = null;
try { TOK = localStorage.getItem('union20_token'); } catch (e) {}

(async () => {
  const { data } = TOK ? await sb.rpc('me', { tok: TOK }) : { data: null };
  if (!data || !data.name) { $('gate').style.display = ''; return; }
  ME = data; $('me').textContent = data.name + ' 님'; $('app').style.display = '';
  await loadSettings(); await load(); setInterval(load, 6000);
})();

async function loadSettings(){
  const { data } = await sb.from('settings').select('key,value');
  const s = Object.fromEntries((data || []).map(r => [r.key, r.value]));
  showCount = s.show_like_count === 'true'; voteOpen = s.vote_open === 'true';
  if (s.upload_open !== 'true') { $('upCard').innerHTML = '<p style="margin:0;color:var(--muted)">사진 접수가 마감되었습니다. 아래에서 투표에 참여해 주세요.</p>'; }
}

/* ── 업로드 ── */
$('file').onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  $('msg').className = 'msg'; $('msg').textContent = '사진 준비 중…'; $('btnUp').disabled = true;
  try { blob = await toJpeg(f, 1600, .85); }
  catch (err) { blob = null; return fail('이 사진은 처리할 수 없습니다. 다른 사진을 선택해 주세요.'); }
  $('thumb').style.backgroundImage = `url(${URL.createObjectURL(blob)})`; $('thumb').textContent = '';
  $('msg').textContent = `준비 완료 (${(blob.size / 1024 | 0)}KB)`; $('btnUp').disabled = false;
};
async function toJpeg(file, max, q){
  let bmp;
  try { bmp = await createImageBitmap(file, { imageOrientation: 'from-image' }); }
  catch (e) { bmp = await new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = URL.createObjectURL(file); }); }
  const w = bmp.width, h = bmp.height, k = Math.min(1, max / Math.max(w, h));
  const c = document.createElement('canvas'); c.width = Math.round(w * k); c.height = Math.round(h * k);
  c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
  return new Promise((res, rej) => c.toBlob(b => b ? res(b) : rej(new Error('encode')), 'image/jpeg', q));
}
$('btnUp').onclick = async () => {
  if (!blob) return;
  $('btnUp').disabled = true; $('prog').style.display = 'block'; $('prog').firstElementChild.style.width = '30%';
  const path = `${ME.id}/${Date.now()}.jpg`;
  const up = await sb.storage.from('photos').upload(path, blob, { contentType: 'image/jpeg', upsert: false });
  if (up.error) { $('prog').style.display = 'none'; $('btnUp').disabled = false; return fail('업로드 실패: ' + up.error.message); }
  $('prog').firstElementChild.style.width = '80%';
  const { error } = await sb.rpc('add_photo', { tok: TOK, p_path: path, p_caption: $('cap').value.trim() });
  $('prog').firstElementChild.style.width = '100%';
  setTimeout(() => { $('prog').style.display = 'none'; $('prog').firstElementChild.style.width = '0'; }, 400);
  if (error) { await sb.storage.from('photos').remove([path]); $('btnUp').disabled = false; return fail(error.message.replace(/^.*?: /, '')); }
  blob = null; $('file').value = ''; $('cap').value = ''; $('thumb').style.backgroundImage = ''; $('thumb').textContent = '미리보기';
  $('msg').textContent = '올렸습니다!'; toast('사진이 등록되었습니다'); load();
};
function fail(t){ $('msg').textContent = t; $('msg').className = 'msg err'; }

/* ── 갤러리 ── */
async function load(){
  const [ps, ml, mp] = await Promise.all([
    sb.from('photo_scores').select('*').order('created_at', { ascending: false }),
    sb.rpc('my_likes', { tok: TOK }), sb.rpc('my_photos', { tok: TOK })
  ]);
  photos = ps.data || []; liked = new Set(ml.data || []); mine = new Set((mp.data || []).map(p => p.id));
  $('quota').textContent = `(${mine.size}/3장 올림)`;
  $('cnt').textContent = photos.length ? `${photos.length}장` : '';
  $('grid').innerHTML = photos.map(p => `<div class="ph ${mine.has(p.id) ? 'mine' : ''}" data-id="${p.id}">
    <img src="${url(p.path)}" loading="lazy" alt="">
    ${mine.has(p.id) ? '' : `<span class="like ${liked.has(p.id) ? 'on' : ''}">${HEART}${showCount ? p.likes : ''}</span>`}
    ${mine.has(p.id) ? `<button class="del" data-del="${p.id}">삭제</button>` : ''}
    ${p.caption ? `<div class="cap">${esc(p.caption)}</div>` : ''}</div>`).join('')
    || '<p style="grid-column:1/-1;color:var(--muted);text-align:center;padding:30px 0">아직 올라온 사진이 없습니다.<br>첫 번째 사진을 올려보세요!</p>';
}
$('grid').onclick = async e => {
  const del = e.target.dataset.del;
  if (del) { if (confirm('이 사진을 삭제할까요?')) { await sb.rpc('delete_my_photo', { tok: TOK, p_photo: +del }); load(); } return; }
  const ph = e.target.closest('.ph'); if (!ph) return;
  openView(+ph.dataset.id);
};
function openView(id){
  cur = photos.find(p => p.id === id); if (!cur) return;
  $('vimg').src = url(cur.path); $('vt').innerHTML = `${esc(cur.caption || '')}<b>${esc(cur.author)}</b>`;
  renderLike(); $('view').classList.add('on');
}
function renderLike(){
  const b = $('vlike'); if (mine.has(cur.id)) { b.style.display = 'none'; return; }
  b.style.display = ''; b.className = 'lk' + (liked.has(cur.id) ? ' on' : '');
  b.innerHTML = HEART + (liked.has(cur.id) ? ' 좋아요 취소' : ' 좋아요') + (showCount ? ` · ${cur.likes}` : '');
}
$('vlike').onclick = async () => {
  if (!voteOpen) return toast('투표가 마감되었습니다');
  const { data, error } = await sb.rpc('toggle_like', { tok: TOK, p_photo: cur.id });
  if (error) return toast(error.message.replace(/^.*?: /, ''));
  data ? liked.add(cur.id) : liked.delete(cur.id); cur.likes += data ? 1 : -1; renderLike(); load();
};
$('vx').onclick = () => $('view').classList.remove('on');
$('vimg').onclick = () => $('view').classList.remove('on');
</script>
</body>
</html>
