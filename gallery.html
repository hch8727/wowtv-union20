<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>사진 이벤트 | 한국경제TV노조출석부</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root{--ink:#00538E;--ink-deep:#003660;--gold:#1EC2F2;--gold-soft:#8FE3FF;--muted:#8fb0c9}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{font-family:Pretendard,-apple-system,"Malgun Gothic",sans-serif;background:var(--ink);color:#fff;overflow:hidden;
       background-image:radial-gradient(ellipse at 50% 120%,#0a6fb4 0%,var(--ink) 50%,var(--ink-deep) 100%)}
  header{position:fixed;left:56px;top:36px;right:56px;display:flex;align-items:center;justify-content:space-between;z-index:3}
  .brand{width:auto;height:auto;max-width:100%;background:#fff;padding:10px 18px;border-radius:12px;box-sizing:content-box}
  .title{font-size:26px;font-weight:600;color:var(--gold-soft)}
  .title b{color:#fff;font-weight:800;margin-left:10px}
  /* 전시 벽 레이아웃 */
  #show{position:absolute;inset:120px 56px 40px;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:40px;align-items:stretch}
  .feat{position:relative;display:flex;flex-direction:column;justify-content:center;min-height:0}
  .frame{position:relative;background:#fff;padding:18px 18px 0;border-radius:6px;box-shadow:0 30px 70px rgba(0,0,0,.45);margin:0 auto;max-width:100%;
         opacity:0;transform:translateY(16px) rotate(-.6deg);transition:opacity .8s ease,transform .8s ease}
  .frame.on{opacity:1;transform:none}
  .frame img{display:block;max-width:100%;max-height:calc(100vh - 360px);width:auto;height:auto;border-radius:2px;background:#eee}
  .frame .label{padding:16px 4px 18px;color:#1a2a3a;display:flex;justify-content:space-between;align-items:baseline;gap:16px}
  .frame .label .c{font-size:22px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .frame .label .c.none{color:#9aa7b4;font-weight:400}
  .frame .label .a{font-size:16px;color:var(--ink);letter-spacing:.1em;font-variant-numeric:tabular-nums;flex:none}
  .wall{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;min-height:0;align-content:center;overflow:hidden}
  .tile{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:rgba(255,255,255,.08);cursor:pointer;transition:transform .3s,box-shadow .3s}
  .tile img{width:100%;height:100%;object-fit:cover;display:block;transition:opacity .4s}
  .tile.on{box-shadow:0 0 0 4px var(--gold),0 12px 30px rgba(0,0,0,.4);transform:scale(1.04);z-index:1}
  .tile.new::after{content:"NEW";position:absolute;left:8px;top:8px;background:var(--gold);color:#fff;font-size:11px;font-weight:800;padding:3px 7px;border-radius:999px;letter-spacing:.08em}
  .tile .more{position:absolute;inset:0;display:grid;place-items:center;background:rgba(0,30,55,.7);font-size:28px;font-weight:800;color:#fff}
  .empty{grid-column:1/-1;align-self:center;color:var(--muted);font-size:28px;text-align:center}
  /* 결과 발표 */
  #result{position:fixed;inset:0;background:var(--ink-deep);display:none;z-index:5;padding:120px 56px 40px}
  #result.on{display:block}
  .podium{height:100%;display:grid;grid-template-columns:1fr 1.3fr 1fr;gap:36px;align-items:end}
  .pl{display:flex;flex-direction:column;align-items:center;gap:14px;opacity:0;transform:translateY(40px);transition:opacity .7s,transform .7s}
  .pl.on{opacity:1;transform:none}
  .pl img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
  .pl .rk{font-size:22px;font-weight:700;color:var(--gold-soft)}
  .pl .who{font-size:26px;font-weight:800;letter-spacing:.06em}
  .pl .lk{font-size:18px;color:var(--muted)}
  .pl.first img{outline:5px solid #f4c84a;outline-offset:6px}
  .pl.first .rk{color:#f4c84a;font-size:30px}
  #result h2{position:fixed;top:40px;left:0;right:0;text-align:center;margin:0;font-size:36px;font-weight:800}
  .hint{position:fixed;left:16px;bottom:78px;font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<header>
  <img class="brand" src="https://img.wowtv.co.kr/PcStyle/images/ir/logo.png" alt="한국경제TV">
  <div class="title">사진 이벤트 <b id="n"></b></div>
</header>

<div id="show">
  <div class="empty" id="empty">아직 올라온 사진이 없습니다<br><span style="font-size:20px">QR로 출석 후 사진 이벤트에 참여해 주세요</span></div>
  <div class="feat" id="feat"></div>
  <div class="wall" id="wall"></div>
</div>
<div class="hint">R: 결과 발표 · Esc: 슬라이드로 · ←→ 넘김</div>

<div id="result"><h2>인기상 발표</h2><div class="podium" id="podium"></div></div>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL = 'https://pmpifokwmrkqrmumycjx.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBtcGlmb2t3bXJrcXJtdW15Y2p4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIxNTQ0ODcsImV4cCI6MjEwNzczMDQ4N30.e4x2eWP33EyTq9_GoAyL9M8WXSzhMKeUdKv6RRLRScY';
const SLIDE_MS = 6000, POLL_MS = 8000;
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const url = p => /^https?:/.test(p) ? p : sb.storage.from('photos').getPublicUrl(p).data.publicUrl;

let photos = [], idx = -1, last4 = {}, timer, newest = null; const TILES = 12;

async function load(){
  const [ps, at] = await Promise.all([ sb.from('photo_scores').select('*').order('created_at'), sb.from('attendee_public').select('name,last4') ]);
  const fresh = ps.data || [];
  (at.data || []).forEach(a => last4[a.name] = a.last4);   // 작성자 이름 → 뒷자리 (동명이인은 마지막 값)
  const added = fresh.length > photos.length && photos.length > 0;
  photos = fresh;
  $('n').textContent = photos.length ? photos.length + '장' : '';
  $('empty').style.display = photos.length ? 'none' : '';
  $('feat').style.display = $('wall').style.display = photos.length ? '' : 'none';
  if (added) { newest = photos[photos.length - 1].id; setTimeout(() => { newest = null; renderWall(); }, 20000); }
  renderWall();
  if (added) jump(photos.length - 1);                       // 새 사진은 바로 크게
  else if (idx < 0 && photos.length) next();
}
function renderWall(){
  const recent = [...photos].reverse();                     // 최신순
  const show = recent.slice(0, TILES), rest = recent.length - show.length;
  $('wall').innerHTML = show.map((p, i) => `<div class="tile ${p.id === newest ? 'new' : ''}" data-id="${p.id}"><img src="${url(p.path)}" loading="lazy">
    ${i === TILES - 1 && rest > 0 ? `<div class="more">+${rest}</div>` : ''}</div>`).join('');
  markWall();
}
function markWall(){ const id = photos[idx]?.id; $('wall').querySelectorAll('.tile').forEach(t => t.classList.toggle('on', +t.dataset.id === id)); }
$('wall').onclick = e => { const t = e.target.closest('.tile'); if (!t) return; const i = photos.findIndex(p => p.id === +t.dataset.id); if (i >= 0) jump(i); };
function next(){ if (!photos.length) return; jump((idx + 1) % photos.length); }
function jump(i){
  clearTimeout(timer); idx = i; const p = photos[i];
  const old = $('feat').querySelector('.frame.on'); if (old) { old.classList.remove('on'); setTimeout(() => old.remove(), 900); }
  const f = document.createElement('div'); f.className = 'frame';
  f.innerHTML = `<img src="${url(p.path)}"><div class="label"><span class="c ${p.caption ? '' : 'none'}">${esc(p.caption || '제목 없음')}</span><span class="a">${last4[p.author] || ''}</span></div>`;
  $('feat').appendChild(f); requestAnimationFrame(() => requestAnimationFrame(() => f.classList.add('on')));
  markWall(); timer = setTimeout(next, SLIDE_MS);
}

/* ── 결과 발표 ── */
async function reveal(){
  clearTimeout(timer);
  const top = [...photos].sort((a, b) => b.likes - a.likes || new Date(a.created_at) - new Date(b.created_at)).slice(0, 3);
  if (!top.length) return;
  $('podium').innerHTML = [top[1], top[0], top[2]].map((p, i) => p ? `<div class="pl ${i === 1 ? 'first' : ''}" id="pl${i}">
    <div class="rk">${['2위','1위','3위'][i]}</div><img src="${url(p.path)}">
    <div class="who">${last4[p.author] || ''}</div><div class="lk">♥ ${p.likes}</div></div>` : '<div></div>').join('');
  $('result').classList.add('on');
  const seq = [2, 0, 1];                                     // 3위 → 2위 → 1위
  for (const i of seq) { const el = $('pl' + i); if (!el) continue; await new Promise(r => setTimeout(r, 1400)); el.classList.add('on'); }
  if (window.confetti) { const colors = ['#f4c84a','#fff','#1EC2F2','#8FE3FF'];
    confetti({ particleCount: 160, angle: 60, spread: 70, origin: { x: 0, y: .7 }, colors, zIndex: 9 });
    confetti({ particleCount: 160, angle: 120, spread: 70, origin: { x: 1, y: .7 }, colors, zIndex: 9 });
    setTimeout(() => confetti({ particleCount: 200, spread: 120, origin: { y: .4 }, colors, zIndex: 9, scalar: 1.3 }), 500); }
}
document.addEventListener('keydown', e => {
  if (e.key === 'r' || e.key === 'R') { if (confirm('인기상 결과를 발표할까요? (투표 마감 후 진행하세요)')) reveal(); }
  if (e.key === 'Escape') { $('result').classList.remove('on'); next(); }
  if (e.key === 'ArrowRight') next();
  if (e.key === 'ArrowLeft' && photos.length) jump((idx - 1 + photos.length) % photos.length);
});

load(); setInterval(load, POLL_MS);
</script>
</body>
</html>
