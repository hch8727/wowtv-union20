<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>행사 화면 | 한국경제TV노조출석부</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root{--ink:#00538E;--ink-deep:#003660;--gold:#1EC2F2;--gold-soft:#8FE3FF;--muted:#8fb0c9}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{font-family:Pretendard,-apple-system,"Malgun Gothic",sans-serif;background:var(--ink);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:40px;
       background-image:radial-gradient(ellipse at 50% 120%,#0a6fb4 0%,var(--ink) 50%,var(--ink-deep) 100%)}
  .brand{width:420px;height:auto;background:#fff;padding:14px 22px;border-radius:12px;box-sizing:content-box}
  h1{font-size:30px;font-weight:700;margin:0;color:var(--gold-soft)}
  .grid{display:flex;gap:28px}
  a.card{width:300px;padding:34px 28px;border-radius:22px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);color:#fff;text-decoration:none;
         display:flex;flex-direction:column;gap:12px;transition:transform .2s,background .2s}
  a.card:hover{transform:translateY(-4px);background:rgba(255,255,255,.14)}
  a.card .k{width:40px;height:40px;border-radius:12px;background:var(--gold);display:grid;place-items:center;font-weight:800;font-size:20px}
  a.card b{font-size:26px}
  a.card span{color:var(--muted);font-size:15px;line-height:1.5}
  .tip{color:var(--muted);font-size:14px;text-align:center;line-height:1.7}
  .tip kbd{background:rgba(255,255,255,.15);padding:2px 8px;border-radius:6px;font-family:inherit}
  /* 드래그·선택 방지 */
  body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  img{-webkit-user-drag:none;user-drag:none;pointer-events:none}
  input,textarea{-webkit-user-select:text;user-select:text}
</style>
</head>
<body>
  <img class="brand" src="logo.png" alt="한국경제TV">
  <h1>노동조합 창립 20주년 · 행사 화면</h1>
  <div class="grid">
    <a class="card" href="monitor.html"><div class="k">1</div><b>출석 현황</b><span>실시간 카운트와 QR 코드. 행사 시작 전부터 띄워 두세요.</span></a>
    <a class="card" href="draw.html"><div class="k">2</div><b>경품 추첨</b><span>슬롯 릴 추첨. 관리자 비밀번호가 필요합니다.</span></a>
  </div>
  <p class="tip">어느 화면에서든 마우스를 움직이면 위에 전환 탭이 나타나고, 숫자키 <kbd>1</kbd> <kbd>2</kbd>로도 바로 이동합니다.<br><kbd>F11</kbd> 전체화면을 권장합니다.</p>
<script>addEventListener('keydown', e => { const m = { '1': 'monitor.html', '2': 'draw.html' }[e.key]; if (m) location.href = m; });</script>
</body>
</html>
