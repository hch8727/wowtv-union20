<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>행사 화면</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
  :root{--gold:#1EC2F2;--gold-soft:#8FE3FF;--muted:#8fb0c9}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{font-family:Pretendard,-apple-system,"Malgun Gothic",sans-serif;background:#07101e;color:#fff;overflow:hidden;position:relative;isolation:isolate;-webkit-user-select:none;user-select:none}
  body.hasbg::after{content:"";position:fixed;inset:0;background:center/cover no-repeat;background-image:var(--bgimg);filter:contrast(1.25) saturate(1.15) brightness(.95);z-index:-2}
  body.hasbg::before{content:"";position:fixed;inset:0;background:rgba(2,10,30,.45);z-index:-1}
  img{-webkit-user-drag:none;pointer-events:none}
  .sign{position:fixed;left:36px;top:30px;display:flex;align-items:center;gap:20px;padding:12px 22px 12px 14px;border-radius:20px;background:rgba(0,25,55,.45);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.14);pointer-events:none;z-index:5}
  .sign .lg{background:#fff;border-radius:10px;padding:8px 14px}.sign .lg img{height:34px;width:auto;display:block}
  .sign .r{display:flex;flex-direction:column;gap:2px;border-left:1px solid rgba(255,255,255,.18);padding-left:20px}
  .sign .t{font-size:14px;color:var(--gold-soft);font-weight:600}
  .sign .c{font-size:34px;font-weight:800;line-height:1.05;font-variant-numeric:tabular-nums}
  .launch{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px}
  h1{font-size:30px;font-weight:700;margin:0;color:var(--gold-soft)}
  #launchGrid{display:flex;gap:24px;flex-wrap:wrap;justify-content:center;max-width:94vw}
  a.card{width:250px;padding:30px 26px;border-radius:22px;background:rgba(0,25,55,.5);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.14);color:#fff;text-decoration:none;display:flex;flex-direction:column;gap:12px;transition:transform .2s,background .2s}
  a.card:hover{transform:translateY(-4px);background:rgba(0,25,55,.7)}
  a.card .k{width:40px;height:40px;border-radius:12px;background:var(--gold);display:grid;place-items:center;font-weight:800;font-size:20px}
  a.card b{font-size:24px}
  a.card span{color:var(--muted);font-size:14px;line-height:1.5}
  .tip{color:var(--muted);font-size:14px;text-align:center;line-height:1.7;margin:0}
  .tip kbd{background:rgba(255,255,255,.15);padding:2px 8px;border-radius:6px;font-family:inherit}
</style>
</head>
<body>
  <div class="sign"><div class="lg"><img src="logo.png" alt=""></div><div class="r"><div class="t">창립 20주년 기념행사</div><div class="c" id="clock">--:--</div></div></div>
  <div class="launch">
    <h1 data-brand="title">창립 20주년 기념행사</h1>
    <div id="launchGrid"></div>
    <p class="tip">카드 왼쪽 위 글자가 단축키입니다 · <kbd>?</kbd> 단축키 전체 보기 · <kbd>Esc</kbd> 효과음 정지<br><kbd>F11</kbd> 전체화면을 권장합니다. 메뉴와 단축키는 관리자 &gt; 화면 탭에서 바꿀 수 있습니다.</p>
  </div>
<script>
(() => { const t = new Image(); t.onload = () => { document.body.style.setProperty('--bgimg', 'url(draw_bg.jpg)'); document.body.classList.add('hasbg'); }; t.src = 'draw_bg.jpg'; })();
(() => { const el = document.getElementById('clock'); const tick = () => { const d = new Date(); el.textContent = String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); }; tick(); setInterval(tick, 1000); })();
</script>
<script src="common.js"></script>
</body>
</html>
