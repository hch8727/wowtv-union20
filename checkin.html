<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>한국경제TV노조출석부</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root{
    --ink:#00538E; --paper:#ffffff; --accent:#1EC2F2; --accent-deep:#0E8FBE;
    --line:#d6e3ee; --muted:#5f7387; --ok:#1f7a4d; --err:#b42318;
    box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *,*::before,*::after{box-sizing:inherit}
  html,body{height:100%;margin:0}
  body{font-family:Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;background:var(--paper);color:var(--ink);
       -webkit-font-smoothing:antialiased;display:flex;flex-direction:column}
  header{padding:36px 24px 8px;text-align:center}
  .brand{display:block;width:min(100%,300px);height:auto;margin:0 auto 22px}
  header p{margin:0;font-size:22px;font-weight:700;line-height:1.4;letter-spacing:-.01em}
  header small{display:inline-block;color:var(--accent-deep);font-size:13px;font-weight:600;margin-top:10px;padding:4px 12px;border:1px solid var(--accent);border-radius:999px}
  main{flex:1;padding:24px;max-width:420px;width:100%;margin:0 auto}
  label{display:block;font-size:14px;color:var(--muted);margin:18px 0 6px}
  input{width:100%;font:inherit;font-size:20px;padding:14px 16px;border:1.5px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);outline:none}
  input:focus{border-color:var(--accent-deep)}
  button{width:100%;font:inherit;font-size:18px;font-weight:700;padding:17px;margin-top:28px;border:0;border-radius:14px;background:var(--ink);color:#fff;cursor:pointer}
  button:disabled{opacity:.5}
  button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
  .notice{font-size:13px;color:var(--muted);line-height:1.6;margin-top:16px}
  .msg{margin-top:14px;font-size:15px;min-height:1.5em}
  .msg.err{color:var(--err)}
  /* 완료 화면 */
  .done{display:none;text-align:center;padding-top:8px}
  .done .check{width:88px;height:88px;border-radius:50%;background:var(--accent);margin:8px auto 20px;display:grid;place-items:center}
  .done .check svg{width:44px;height:44px}
  .done h2{font-size:26px;margin:0 0 6px}
  .done p{color:var(--muted);margin:0;line-height:1.6}
  .done .time{margin-top:20px;font-size:15px;color:var(--ink)}
  .done.show{display:block;animation:pop .35s ease-out}
  @keyframes pop{from{transform:scale(.92);opacity:0}to{transform:scale(1);opacity:1}}
  @media (prefers-reduced-motion:reduce){.done.show{animation:none}}
  footer{text-align:center;color:var(--muted);font-size:12px;padding:16px}
</style>
</head>
<body>
<header>
  <img class="brand" src="logo.png" alt="한국경제TV">
  <p>한국경제TV 노동조합 창립 20주년</p>
  <small>출석 확인</small>
</header>

<main>
  <form id="form" novalidate>
    <label for="name">이름</label>
    <input id="name" autocomplete="name" placeholder="홍길동" required>
    <label for="phone">전화번호</label>
    <input id="phone" type="tel" inputmode="numeric" autocomplete="tel" placeholder="010-0000-0000" required>
    <button id="btn" type="submit">출석하기</button>
    <div id="msg" class="msg" role="alert"></div>
    <p class="notice">전화번호는 경품 당첨 안내에만 사용하고 행사 종료 후 삭제합니다.</p>
  </form>

  <section id="done" class="done">
    <div class="check"><svg viewBox="0 0 24 24" fill="none" stroke="#00538E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></svg></div>
    <h2 id="doneName"></h2>
    <p>출석이 확인되었습니다.<br>행사 끝까지 함께해 주세요.</p>
    <div class="time" id="doneTime"></div>
  </section>
</main>
<footer>한국경제TV 노동조합</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL = 'https://pmpifokwmrkqrmumycjx.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBtcGlmb2t3bXJrcXJtdW15Y2p4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIxNTQ0ODcsImV4cCI6MjEwNzczMDQ4N30.e4x2eWP33EyTq9_GoAyL9M8WXSzhMKeUdKv6RRLRScY';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const TOKEN_KEY = 'union20_token';

const $ = id => document.getElementById(id);
const form = $('form'), done = $('done'), msg = $('msg'), btn = $('btn');

function store(k, v){ try{ v==null ? localStorage.removeItem(k) : localStorage.setItem(k, v) }catch(e){} }
function load(k){ try{ return localStorage.getItem(k) }catch(e){ return null } }

function showDone(name, when){
  form.style.display = 'none';
  $('doneName').textContent = name + ' 님';
  $('doneTime').textContent = when ? new Date(when).toLocaleString('ko-KR',{month:'long',day:'numeric',hour:'2-digit',minute:'2-digit'}) + ' 출석' : '';
  done.classList.add('show');
}

// 전화번호 자동 하이픈
$('phone').addEventListener('input', e => {
  const d = e.target.value.replace(/\D/g,'').slice(0,11);
  e.target.value = d.length > 7 ? d.replace(/(\d{3})(\d{3,4})(\d{4})/,'$1-$2-$3')
                 : d.length > 3 ? d.replace(/(\d{3})(\d+)/,'$1-$2') : d;
});

form.addEventListener('submit', async e => {
  e.preventDefault();
  const name = $('name').value.trim(), phone = $('phone').value.replace(/\D/g,'');
  msg.className = 'msg';
  if (name.length < 2) return fail('이름을 입력해 주세요.');
  if (!/^01\d{8,9}$/.test(phone)) return fail('휴대폰 번호 11자리를 확인해 주세요.');

  btn.disabled = true; btn.textContent = '확인 중…';
  const { data, error } = await sb.rpc('check_in', { p_name: name, p_phone: phone });
  btn.disabled = false; btn.textContent = '출석하기';
  if (error) return fail(error.message.replace(/^.*?: /,''));

  store(TOKEN_KEY, data.token);
  showDone(data.name, new Date());
});

function fail(t){ msg.textContent = t; msg.className = 'msg err'; }

// 재접속: 토큰 있으면 바로 완료 화면
(async () => {
  const tok = load(TOKEN_KEY);
  if (!tok) return;
  const { data } = await sb.rpc('me', { tok });
  if (data && data.name) showDone(data.name, null);
  else store(TOKEN_KEY, null);
})();
</script>
</body>
</html>
