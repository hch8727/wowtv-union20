<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>출석 현황 | 한국경제TV노조출석부</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root{--ink:#00538E;--ink-deep:#003660;--gold:#1EC2F2;--gold-soft:#8FE3FF;--muted:#8fb0c9;--paper:#fff}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{font-family:Pretendard,-apple-system,"Malgun Gothic",sans-serif;background:var(--ink);color:#fff;overflow:hidden;
       background-image:radial-gradient(ellipse at 50% 120%,#0a6fb4 0%,var(--ink) 50%,var(--ink-deep) 100%)}
  .wrap{height:100%;display:grid;grid-template-columns:1fr 360px;grid-template-rows:auto 1fr;gap:0 48px;padding:40px 56px}
  header{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between}
  .brand{width:auto;height:auto;max-width:100%;background:#fff;padding:10px 18px;border-radius:12px;box-sizing:content-box}
  .stage{display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
  .label{font-size:28px;color:var(--gold-soft);font-weight:500;letter-spacing:.02em}
  .count{font-size:min(30vw,340px);line-height:1;font-weight:800;letter-spacing:-.05em;font-variant-numeric:tabular-nums;margin:8px 0 0}
  .count.bump{animation:bump .45s cubic-bezier(.2,.9,.3,1.4)}
  @keyframes bump{30%{transform:scale(1.06);color:var(--gold-soft)}}
  .unit{font-size:36px;font-weight:600;color:var(--muted);margin-left:12px;letter-spacing:0}
  .recent{margin-top:28px;display:flex;gap:12px;flex-wrap:wrap;justify-content:center;max-width:900px;min-height:52px}
  .chip{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);border-radius:999px;padding:10px 20px;font-size:22px;animation:slide .4s ease-out}
  .chip:first-child{background:var(--gold);color:#fff;border-color:var(--gold);font-weight:700}
  @keyframes slide{from{opacity:0;transform:translateY(10px)}}
  aside{display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:18px}
  .qr{background:#fff;padding:18px;border-radius:20px;width:300px;height:300px;display:grid;place-items:center}
  .qr img,.qr canvas{width:264px!important;height:264px!important;image-rendering:pixelated}
  aside p{margin:0;font-size:20px;line-height:1.5;color:#dfe4f0}
  aside p b{display:block;color:var(--gold-soft);font-size:24px;margin-bottom:4px}
  .status{position:fixed;left:16px;bottom:12px;font-size:13px;color:var(--muted)}
  .status.live::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:#2fbf71;margin-right:6px}
  @media (prefers-reduced-motion:reduce){.count.bump,.chip{animation:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <img class="brand" src="https://img.wowtv.co.kr/PcStyle/images/ir/logo.png" alt="한국경제TV">
  </header>

  <section class="stage">
    <div class="label">지금까지 출석하신 분</div>
    <div><span class="count" id="count">0</span><span class="unit">명</span></div>
    <div class="recent" id="recent"></div>
  </section>

  <aside>
    <div class="qr" id="qr"></div>
    <p><b>QR을 찍어 출석해 주세요</b>카메라 또는 카카오톡 스캔</p>
  </aside>
</div>
<div class="status" id="status">연결 중…</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
const SUPABASE_URL = 'https://pmpifokwmrkqrmumycjx.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBtcGlmb2t3bXJrcXJtdW15Y2p4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIxNTQ0ODcsImV4cCI6MjEwNzczMDQ4N30.e4x2eWP33EyTq9_GoAyL9M8WXSzhMKeUdKv6RRLRScY';
const CHECKIN_URL = location.href.replace(/monitor\.html.*$/, 'checkin.html'); // 배포 주소에 맞게 수정 가능
const POLL_MS = 2500, RECENT_N = 8;

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $count = document.getElementById('count'), $recent = document.getElementById('recent'), $status = document.getElementById('status');
new QRCode(document.getElementById('qr'), { text: CHECKIN_URL, width: 264, height: 264, correctLevel: QRCode.CorrectLevel.M });

let last = -1, lastIds = new Set();

async function tick(){
  const { data, error } = await sb.from('attendee_public')
    .select('id,name,checked_in_at', { count: 'exact' })
    .order('checked_in_at', { ascending: false }).limit(RECENT_N);
  if (error) { $status.textContent = '연결 오류: ' + error.message; $status.className = 'status'; return; }
  $status.textContent = '실시간 반영 중'; $status.className = 'status live';

  const total = data.length ? await countAll() : 0;
  if (total !== last) {
    $count.textContent = total.toLocaleString('ko-KR');
    if (last >= 0) { $count.classList.remove('bump'); void $count.offsetWidth; $count.classList.add('bump'); }
    last = total;
  }
  const ids = data.map(r => r.id).join();
  if (ids !== [...lastIds].join()) {
    $recent.innerHTML = data.map(r => `<span class="chip">${esc(r.name)}</span>`).join('');
    lastIds = new Set(data.map(r => r.id));
  }
}
async function countAll(){
  const { count } = await sb.from('attendee_public').select('id', { count: 'exact', head: true });
  return count ?? 0;
}
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

tick(); setInterval(tick, POLL_MS);
</script>
</body>
</html>
