<!DOCTYPE html>
<html lang="ko">
<head>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root{--ink:#00538E;--ink-deep:#003660;--gold:#1EC2F2;--gold-soft:#8FE3FF;--muted:#8fb0c9;--paper:#fff}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}

       background-image:linear-gradient(#1a8fd0 0%,#0b64a6 30%,#00538E 60%,#022c52 100%)}

  .wrap{height:100%;padding:36px 48px;display:flex;flex-direction:column;pointer-events:none}
  header{display:flex;align-items:flex-start;justify-content:space-between;pointer-events:none}
  .panel{display:flex;align-items:center;gap:26px;background:rgba(0,25,55,.42);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.12);border-radius:22px;padding:16px 22px 16px 28px}

  .count{font-size:112px;line-height:1;font-weight:800;letter-spacing:0;font-variant-numeric:tabular-nums;vertical-align:bottom}

  @keyframes bump{30%{transform:scale(1.06);color:var(--gold-soft)}}
  .unit{font-size:26px;font-weight:600;color:var(--muted);letter-spacing:0;align-self:flex-end;padding-bottom:1.3em}
  /* 6. 출석 순간 연출 */
  #pop{position:fixed;left:50%;top:66%;transform:translate(-50%,-50%);font-size:40px;font-weight:800;letter-spacing:.08em;color:#fff;
       text-shadow:0 2px 12px rgba(0,0,0,.5);pointer-events:none;opacity:0;z-index:4;background:rgba(0,25,55,.45);padding:8px 26px;border-radius:999px}
  #pop.go{animation:popin 2.4s ease-out forwards}
  @keyframes popin{0%{opacity:0;transform:translate(-50%,-30%)}15%{opacity:1;transform:translate(-50%,-50%)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-70%)}}
  #pop small{font-size:20px;font-weight:600;color:var(--gold-soft);margin-left:14px;letter-spacing:.02em}
  /* 7. 숫자 롤업 */
  .count{display:inline-flex;overflow:hidden;height:1.5em;line-height:1.5}
  .digit{display:inline-block;width:.68em;height:1.5em;position:relative}
  .digit .col{position:absolute;left:0;top:0;width:100%;transition:transform .9s cubic-bezier(.2,.8,.2,1)}
  .digit .col span{display:block;height:1.5em;line-height:1.5;text-align:center}
  .countRow{display:flex;align-items:baseline;gap:10px}
  /* 8. 파티클 */
  #bg{position:fixed;inset:0;z-index:0;pointer-events:none}
  .wrap{position:relative;z-index:1}
  .qrbox{display:flex;flex-direction:column;align-items:center;gap:8px;border-left:1px solid rgba(255,255,255,.14);padding-left:26px}
  .qr{background:#fff;padding:8px;border-radius:12px;width:148px;height:148px;display:grid;place-items:center}
  .qr img,.qr canvas{width:132px!important;height:132px!important;image-rendering:pixelated}
  .qrbox p{margin:0;font-size:13px;line-height:1.4;color:#dfe4f0;text-align:center}
  .qrbox p b{display:block;color:var(--gold-soft);font-size:14px}
  .status{position:fixed;left:16px;bottom:12px;font-size:13px;color:var(--muted)}
  .sndbar{position:fixed;right:16px;bottom:12px;display:flex;align-items:center;gap:8px;z-index:5}
  .sndbar input{width:110px;accent-color:var(--gold)}
  .sndbar span{font-size:12px;color:var(--muted);width:32px;font-variant-numeric:tabular-nums}
  .snd{position:static;font-size:13px;color:var(--muted);background:rgba(0,25,55,.5);border:1px solid rgba(255,255,255,.2);padding:6px 10px;border-radius:8px;cursor:pointer;z-index:5}
  .snd.hint{animation:blink 1.2s ease-in-out infinite alternate}
  @keyframes blink{to{background:rgba(30,194,242,.5);color:#fff}}
  .status.live::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:#2fbf71;margin-right:6px}
  @media (prefers-reduced-motion:reduce){.count.bump,.chip{animation:none}}
  /* 화면 전환 탭 (빔 운영용) */
  .snav{position:fixed;top:14px;left:50%;transform:translateX(-50%);display:flex;gap:4px;background:rgba(0,0,0,.35);backdrop-filter:blur(8px);
        padding:5px;border-radius:999px;z-index:50;opacity:0;transition:opacity .3s;pointer-events:none}
  body.navon .snav{opacity:1;pointer-events:auto}
  .snav a{color:#fff;text-decoration:none;font-size:14px;font-weight:600;padding:8px 16px;border-radius:999px;opacity:.75}
  .snav a:hover{opacity:1;background:rgba(255,255,255,.12)}
  .snav a.cur{opacity:1;background:var(--gold);color:#fff}
  /* 드래그·선택 방지 */
  body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  img{-webkit-user-drag:none;user-drag:none;pointer-events:none}
  input,textarea{-webkit-user-select:text;user-select:text}
</style>
</head>

<script>
const SUPABASE_URL = 'https://pmpifokwmrkqrmumycjx.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBtcGlmb2t3bXJrcXJtdW15Y2p4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIxNTQ0ODcsImV4cCI6MjEwNzczMDQ4N30.e4x2eWP33EyTq9_GoAyL9M8WXSzhMKeUdKv6RRLRScY';
const CHECKIN_URL = location.href.replace(/monitor\.html.*$/, 'checkin.html'); // 배포 주소에 맞게 수정 가능
const POLL_MS = 2500;

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $count = document.getElementById('count'), $status = document.getElementById('status');
(() => { const t = new Image(); t.onload = () => { document.body.classList.add('hasbg'); window.__bg = true; }; t.src = 'bg.jpg'; })();   // bg.jpg가 있으면 배경으로
new QRCode(document.getElementById('qr'), { text: CHECKIN_URL, width: 132, height: 132, correctLevel: QRCode.CorrectLevel.M });

let last = -1, lastIds = new Set(), primed = false;

async function tick(){
  const { data, error } = await sb.from('attendee_public').select('id,last4,checked_in_at').order('checked_in_at');
  if (error) { $status.textContent = '연결 오류: ' + error.message; $status.className = 'status'; return; }
  $status.textContent = '실시간 반영 중'; $status.className = 'status live';

  if (total !== last) {
    setCount(total);
    if (last >= 0) { $count.classList.remove('bump'); void $count.offsetWidth; $count.classList.add('bump'); }
    last = total;
  }
  const cur = new Set(data.map(r => r.id));
  if (primed) {
    const fresh = data.filter(r => !lastIds.has(r.id));                       // 새로 온 사람: 뾱
    fresh.forEach((r, i) => setTimeout(() => { popIn(r.last4); Fish.add(r.id, r.last4, true); Snd.pop(); }, i * 700));
    [...lastIds].filter(id => !cur.has(id)).forEach(id => Fish.remove(id));   // 사라진 사람: 거품과 함께 퇴장
  } else data.forEach(r => Fish.add(r.id, r.last4, false));                   // 첫 로딩
  lastIds = cur; primed = true;
}
/* 7. 숫자 롤업 — 자리별 세로 롤러 */
function setCount(n){
  const str = String(n), cur = $count.querySelectorAll('.digit');
  if (cur.length !== str.length) {
    $count.innerHTML = [...str].map(() => `<span class="digit"><span class="col">${Array.from({length:10},(_, i) => `<span>${i}</span>`).join('')}</span></span>`).join('');
  }
  [...str].forEach((d, i) => { const col = $count.querySelectorAll('.digit .col')[i]; col.style.transform = `translateY(-${d * 1.5}em)`; });
}
/* 6. 출석 순간 연출 */
function popIn(l4){ const p = document.getElementById('pop'); p.innerHTML = `${l4 || '????'}<small>출석 완료!</small>`; p.classList.remove('go'); void p.offsetWidth; p.classList.add('go'); }
/* 8. 어항: 뒷자리 4개가 물고기처럼 헤엄침 + 거품 */
const Fish = (() => {
  const c = document.getElementById('bg'), x = c.getContext('2d'); let W, H; const F = [], B = []; const seen = new Set();
  // 종류별 설정: 이미지, 가로세로비, 번호 위치(비율), 원래 바라보는 방향, 움직임, 활동 수심(화면 비율), 크기
  const SP = {
    clown:    { src: 'clown.png',    ar: 226 / 293, belly: { x: .5, y: .72 },  faces: 1,  mode: 'swim',  zone: [.08, .85], w: [110, 150], p: 15, name: '물고기' },
    blue:     { src: 'blue.png',     ar: 209 / 258, belly: { x: .5, y: .72 },  faces: 1,  mode: 'swim',  zone: [.08, .85], w: [105, 145], p: 15, name: '파랑물고기' },
    turtle:   { src: 'turtle.png',   ar: 261 / 297, belly: { x: .4, y: .5 },   faces: 1,  mode: 'swim',  zone: [.1, .8],   w: [130, 170], p: 11, name: '바다거북' },
    ray:      { src: 'ray.png',      ar: 322 / 325, belly: { x: .46, y: .52 }, faces: 1,  mode: 'swim',  zone: [.15, .8],  w: [150, 200], p: 9,  name: '가오리', slow: .6 },
    jelly:    { src: 'jelly.png',    ar: 326 / 206, belly: { x: .5, y: .5 },   faces: 0,  mode: 'drift', zone: [.06, .5],  w: [80, 110],  p: 10, name: '해파리' },
    seahorse: { src: 'seahorse.png', ar: 302 / 165, belly: { x: .52, y: .5 },  faces: -1, mode: 'hover', zone: [.55, .82], w: [65, 90],   p: 9,  name: '해마' },
    octopus:  { src: 'octopus.png',  ar: 284 / 254, belly: { x: .5, y: .22 },  faces: 0,  mode: 'walk',  zone: [1, 1],     w: [120, 150], p: 8,  name: '문어' },
    crab:     { src: 'crab.png',     ar: 242 / 294, belly: { x: .5, y: .68 },  faces: 0,  mode: 'walk',  zone: [1, 1],     w: [110, 140], p: 8,  name: '꽃게' },
    star:     { src: 'star.png',     ar: 249 / 256, belly: { x: .5, y: .7 },   faces: 0,  mode: 'walk',  zone: [1, 1],     w: [90, 120],  p: 7,  name: '불가사리', slow: .3 },
    puffer:   { src: 'puffer.png',   ar: 217 / 263, belly: { x: .5, y: .72 },  faces: -1, mode: 'swim',  zone: [.1, .8],   w: [100, 130], p: 8,  name: '복어', slow: .5, puff: true },
  };
  const HUES = [0, -22, 22];                                                                 // 색 변형 3종, 미리 렌더링해서 재사용
  for (const k in SP) { const s = SP[k]; s.img = new Image(); s.img.src = s.src; s.v = [];
    s.img.onload = () => { const bw = 320, bh = Math.round(bw * s.ar);
      s.v = HUES.map(h => { const o = document.createElement('canvas'); o.width = bw; o.height = bh; const g = o.getContext('2d');
        if (h) g.filter = `hue-rotate(${h}deg)`; g.drawImage(s.img, 0, 0, bw, bh); return o; }); }; }
  const hash = n => { let h = n ^ 0x9e3779b9; h = Math.imul(h ^ (h >>> 16), 0x85ebca6b); h = Math.imul(h ^ (h >>> 13), 0xc2b2ae35); return (h ^ (h >>> 16)) >>> 0; };   // 같은 id → 항상 같은 결과
  const pick = id => { let r = hash(id) % 100; for (const k in SP) { r -= SP[k].p; if (r < 0) return k; } return 'fish'; };
  const FLOOR = 70; const M = { x: -9999, y: -9999, t: 0 };
  addEventListener('mousemove', e => { M.x = e.clientX; M.y = e.clientY; M.t = performance.now(); });
  addEventListener('mouseleave', () => { M.x = M.y = -9999; });
  const size = () => { W = c.width = innerWidth; H = c.height = innerHeight; }; size();
  let rzT; addEventListener('resize', () => { clearTimeout(rzT); rzT = setTimeout(() => { const ow = W, oh = H; size();
    for (const f of F) { f.x = f.x / ow * W; f.y = f.y / oh * H; f.ty = f.ty / oh * H; if (SP[f.k].mode === 'walk') f.ty = H - FLOOR - f.h * .35; }
    for (const b of B) { b.x = b.x / ow * W; b.y = b.y / oh * H; } }, 150); });
  for (let i = 0; i < 45; i++) B.push({ x: Math.random() * innerWidth, y: Math.random() * innerHeight, r: 1.5 + Math.random() * 5, v: .25 + Math.random() * .6, a: Math.random() * 7 });
  const zones = () => [{ x: W * .78, y: H * .13, rx: W * .26, ry: H * .2 }, { x: W * .14, y: H * .07, rx: W * .16, ry: H * .1 }];   // 우상단 패널·로고 영역은 비켜 다님
  const inZone = (px, py) => zones().some(z => ((px - z.x) / z.rx) ** 2 + ((py - z.y) / z.ry) ** 2 < 1);
  function add(id, l4, fresh){
    if (seen.has(id)) return; seen.add(id);
    const hv = hash(id), k = pick(id), s = SP[k], w = s.w[0] + (hv % 1000) / 1000 * (s.w[1] - s.w[0]), h = w * s.ar;
    let px = Math.random() * W, py = s.mode === 'walk' ? H - FLOOR - h * .35 : H * (s.zone[0] + Math.random() * (s.zone[1] - s.zone[0]));
    for (let i = 0; i < 20 && s.mode !== 'walk' && inZone(px, py); i++) { px = Math.random() * W; py = H * (s.zone[0] + Math.random() * (s.zone[1] - s.zone[0])); }
    const spd = (s.mode === 'swim' ? .35 + Math.random() * .6 : s.mode === 'walk' ? .15 + Math.random() * .25 : .08 + Math.random() * .15) * (s.slow || 1);
    F.push({ id, k, t: l4 || '????', w, h, x: fresh ? W * .5 : px, y: fresh ? H * .46 : py, ty: py,
             vx: (Math.random() < .5 ? -1 : 1) * spd, vy: 0, spd, ph: Math.random() * 7, face: 0, tvx: 0, hue: 0, born: fresh ? performance.now() : 0 });
  }
  const weeds = Array.from({length: 14}, (_, i) => ({ x: (i + .5) / 14, h: 90 + Math.random() * 120, ph: Math.random() * 7, w: 8 + Math.random() * 8 }));
  function sea(now){
    if (window.__bg) return;
    for (let i = 0; i < 6; i++) { const cx = W * (.1 + i * .16) + Math.sin(now / 4000 + i) * 60, sw = 120 + i * 20;
      const g = x.createLinearGradient(0, 0, 0, H * .8); g.addColorStop(0, 'rgba(180,230,255,.14)'); g.addColorStop(1, 'rgba(180,230,255,0)');
      x.fillStyle = g; x.beginPath(); x.moveTo(cx - sw * .3, 0); x.lineTo(cx + sw * .3, 0); x.lineTo(cx + sw + 80, H * .8); x.lineTo(cx - sw + 80, H * .8); x.closePath(); x.fill(); }
    const sg = x.createLinearGradient(0, H - FLOOR, 0, H); sg.addColorStop(0, 'rgba(0,20,45,0)'); sg.addColorStop(1, 'rgba(0,12,30,.9)');
    x.fillStyle = sg; x.fillRect(0, H - FLOOR, W, FLOOR);
    for (const s of weeds) { const bx = s.x * W, sway = Math.sin(now / 1600 + s.ph) * 18;
      x.beginPath(); x.moveTo(bx, H); x.bezierCurveTo(bx - 10, H - s.h * .4, bx + sway, H - s.h * .7, bx + sway * 1.4, H - s.h);
      x.lineWidth = s.w; x.lineCap = 'round'; x.strokeStyle = 'rgba(2,40,60,.75)'; x.stroke();
      x.beginPath(); x.moveTo(bx + 18, H); x.bezierCurveTo(bx + 14, H - s.h * .3, bx + 18 - sway, H - s.h * .5, bx + 18 - sway * 1.2, H - s.h * .7);
      x.lineWidth = s.w * .6; x.strokeStyle = 'rgba(0,55,75,.6)'; x.stroke(); }
  }
  function frame(now){
    x.clearRect(0, 0, W, H); sea(now);
    for (const b of B) { b.y -= b.v; b.x += Math.sin(b.a += .02) * .3; if (b.y < -5) { b.y = H + 5; b.x = Math.random() * W; }
      x.beginPath(); x.arc(b.x, b.y, b.r, 0, 7); x.strokeStyle = 'rgba(200,240,255,.45)'; x.lineWidth = 1.2; x.stroke(); x.beginPath(); x.arc(b.x - b.r * .3, b.y - b.r * .3, b.r * .3, 0, 7); x.fillStyle = 'rgba(255,255,255,.5)'; x.fill(); }
    const zs = zones(); const mouseOn = now - M.t < 2500;        // 마우스가 멈춘 지 2.5초 지나면 무시
    // 바닥 생물이 앞에 오도록 정렬
    F.sort((a, b) => (SP[a.k].mode === 'walk') - (SP[b.k].mode === 'walk') || (!!a.born) - (!!b.born));
    for (const f of F) {
      const s = SP[f.k]; f.ph += .035;
      if (f.born && now - f.born < 1100) { f.x = W * .5; f.y = H * .46; }
      if (mouseOn && !f.born) {                                            // 마우스 가까이 오면 놀라서 달아남
        const dx = f.x - M.x, dy = f.y - M.y, d2 = dx * dx + dy * dy, R = 220;
        if (d2 < R * R) { const d = Math.sqrt(d2) || 1, k = (1 - d / R) * .9;
          if (s.mode === 'walk') { f.vx += (dx / d) * k * 1.2; f.tvx = 0; }
          else { f.vx += (dx / d) * k; if (s.mode === 'swim') f.vy += (dy / d) * k; else f.ty += (dy / d) * k * 6; f.tvx = 0; } }
      }
      if (s.mode === 'swim') {
        f.x += f.vx; f.y += Math.sin(f.ph) * .45 + f.vy;
        for (const z of zs) { const dx = (f.x - z.x) / z.rx, dy = (f.y - z.y) / z.ry; if (dx * dx + dy * dy < 1) { f.vy += dy * .09; f.vx += dx * .05; } }
        f.vy *= .96; f.vx = Math.max(-1.3, Math.min(1.3, f.vx));
        if (Math.random() < .003) f.tvx = -Math.sign(f.vx) * f.spd;
        const lo = H * s.zone[0], hi = H * s.zone[1]; if (f.y < lo) f.vy += .05; if (f.y > hi) f.vy -= .05;
      } else if (s.mode === 'drift') {                        // 해파리: 위아래로 둥실, 느리게 좌우
        f.x += f.vx * .6; f.y = f.ty + Math.sin(f.ph * .9) * 28; if (Math.random() < .002) f.tvx = -Math.sign(f.vx) * f.spd;
        f.ty += (Math.random() - .5) * .3; f.ty = Math.max(H * s.zone[0], Math.min(H * s.zone[1], f.ty));
        if (inZone(f.x, f.ty)) f.ty -= .8;
      } else if (s.mode === 'hover') {                        // 해마: 낮은 곳에서 살랑살랑
        f.x += f.vx * .5; f.ty = Math.max(H * s.zone[0], Math.min(H * s.zone[1], f.ty)); f.y = f.ty + Math.sin(f.ph * 1.3) * 10; if (Math.random() < .003) f.tvx = -Math.sign(f.vx) * f.spd;
      } else {                                                 // 문어·꽃게: 바닥을 기어다님
        f.x += f.vx; f.y = f.ty + Math.abs(Math.sin(f.ph * (f.k === 'crab' ? 4 : 1.2))) * (f.k === 'crab' ? 3 : 6);
        if (Math.random() < .006) f.tvx = -Math.sign(f.vx) * f.spd;
        if (Math.random() < .004) f.vx = 0, f.tvx = (Math.random() < .5 ? -1 : 1) * f.spd;   // 가끔 멈칫
      }
      if (f.tvx) { f.vx += (f.tvx - f.vx) * .04; if (Math.abs(f.tvx - f.vx) < .02) f.tvx = 0; }
      else if (Math.abs(f.vx) > f.spd * 1.05) f.vx *= .985;                                    // 놀란 뒤 제 속도로 복귀
      if (s.mode === 'walk') f.vx = Math.max(-2.2, Math.min(2.2, f.vx)); else if (s.mode !== 'swim') f.vx = Math.max(-1.5, Math.min(1.5, f.vx));
      if (f.x < -f.w) f.x = W + f.w; if (f.x > W + f.w) f.x = -f.w;
      let dir = 1;
      if (s.faces) { const want = (f.vx < 0 ? -1 : 1) * s.faces; f.face += (want - f.face) * .12; dir = f.face; }
      let age = 1, sc = 1, alpha = 1;
      if (f.dying) { const k = (now - f.dying) / 700; if (k >= 1) { F.splice(F.indexOf(f), 1); seen.delete(f.id); continue; } sc = 1 - k; alpha = 1 - k; }
      if (f.born) { const t = (now - f.born) / 1000;                                   // 0~2.2초 등장 연출
        if (t < .5) { const k = t / .5; sc = 2.8 * (1 - Math.pow(2, -10 * k) * Math.cos(k * 7)) ; alpha = Math.min(1, k * 2.5); }   // 0→3.2배로 뾱!
        else if (t < 1.1) sc = 2.8;                                                     // 잠깐 멈춤
        else if (t < 2.2) { const k = (t - 1.1) / 1.1, e = 1 - Math.pow(1 - k, 3); sc = 2.8 + (1 - 2.8) * e; }   // 제 크기로 줄며 합류
        else f.born = 0;
        if (t < .6) { x.save(); x.globalAlpha = (1 - t / .6) * .8; x.strokeStyle = '#fff'; x.lineWidth = 4; x.beginPath(); x.arc(f.x, f.y, 40 + t * 600, 0, 7); x.stroke(); x.restore(); }
        if (sc >= 2.6) { x.save(); x.globalAlpha = .35; x.fillStyle = '#8FE3FF'; x.beginPath(); x.arc(f.x, f.y, f.w * 1.6, 0, 7); x.fill(); x.restore(); }   // 뒤 배경 빛
      }
      if (s.puff) { if (!f.puffT && Math.random() < .002) f.puffT = now; if (f.puffT) { const k = (now - f.puffT) / 2200; if (k >= 1) f.puffT = 0; else sc *= 1 + .35 * Math.sin(Math.min(1, k) * Math.PI); } }
      const w = f.w * sc, h = f.h * sc, tilt = f.born || f.dying ? 0 : s.mode === 'swim' ? Math.sin(f.ph) * .06 * Math.sign(f.vx || 1) : s.mode === 'drift' ? Math.sin(f.ph * .7) * .08 : 0;
      x.save(); x.translate(f.x, f.y); x.rotate(tilt); x.globalAlpha = alpha;
      const sx = s.faces ? (Math.abs(dir) < .08 ? .08 * Math.sign(dir || 1) : dir) : 1;
      if (s.v.length) { x.save(); x.scale(sx, 1); x.drawImage(s.v[f.hue], -w / 2, -h / 2, w, h); x.restore(); }
      const bx = (s.belly.x - .5) * w * sx, by = (s.belly.y - .5) * h;
      x.globalAlpha = alpha * (s.faces ? Math.min(1, Math.abs(dir) * 2.5) : 1);
      x.font = `800 ${Math.round(Math.min(w, h) * .17)}px Pretendard, sans-serif`; x.textAlign = 'center'; x.textBaseline = 'middle';
      x.lineWidth = Math.max(2, w * .02); x.strokeStyle = 'rgba(255,255,255,.9)'; x.strokeText(f.t, bx, by);
      x.fillStyle = '#1b2a4a'; x.fillText(f.t, bx, by); x.restore();
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  function remove(id){ const f = F.find(f => f.id === id); if (!f) return; f.dying = performance.now();
    for (let i = 0; i < 10; i++) B.push({ x: f.x + (Math.random() - .5) * f.w, y: f.y + (Math.random() - .5) * f.h, r: 2 + Math.random() * 5, v: .8 + Math.random() * 1.2, a: Math.random() * 7 }); }
  return { add, remove };
})();

/* 사운드: ambient.mp3(배경, 반복) / pop.mp3(출석 효과음). 파일 없으면 효과음만 합성 */
const Snd = (() => {
  let ctx, on = false, amb = null, ambGain = null, ambBuf = null, popBuf = null, started = false, mg = null;
  let vol = +(localStorage.getItem('union20_vol') ?? 70) / 100;
  const master = () => { const c = ac(); if (c.state === 'suspended') c.resume().catch(() => {}); if (!mg) { mg = c.createGain(); mg.gain.value = vol; mg.connect(c.destination); } return mg; };
  ['click', 'keydown', 'touchstart'].forEach(ev => document.addEventListener(ev, () => { if (ctx && ctx.state === 'suspended') ctx.resume().catch(() => {}); }, { capture: true }));   // 사용자 입력 시 오디오 깨우기
  const ac = () => ctx || (ctx = new (window.AudioContext || window.webkitAudioContext)());
  const load = (n, cb) => fetch(n).then(r => r.ok ? r.arrayBuffer() : null).then(ab => ab && ac().decodeAudioData(ab)).then(b => b && cb(b)).catch(() => {});
  function startAmb(){ if (!ambBuf || amb) return; const c = ac(); amb = c.createBufferSource(); amb.buffer = ambBuf; amb.loop = true; ambGain = c.createGain();
    ambGain.gain.setValueAtTime(0, c.currentTime); ambGain.gain.linearRampToValueAtTime(.8, c.currentTime + 3); amb.connect(ambGain).connect(master()); amb.start(); }
  function stopAmb(){ if (!amb) return; const c = ac(), a = amb, g = ambGain; amb = null; g.gain.linearRampToValueAtTime(0, c.currentTime + 1); setTimeout(() => { try { a.stop(); } catch (e) {} }, 1100); }
  function blop(){ const c = ac(), o = c.createOscillator(), g = c.createGain(); o.type = 'sine';                    // 합성 물방울 "뾱"
    o.frequency.setValueAtTime(220, c.currentTime); o.frequency.exponentialRampToValueAtTime(880, c.currentTime + .12);
    g.gain.setValueAtTime(.001, c.currentTime); g.gain.exponentialRampToValueAtTime(.4, c.currentTime + .03); g.gain.exponentialRampToValueAtTime(.001, c.currentTime + .35);
    o.connect(g).connect(master()); o.start(); o.stop(c.currentTime + .4); }
  return {
    init(){ if (started) return; started = true; ac().resume?.(); load('ambient.mp3', b => { ambBuf = b; if (on) startAmb(); }); load('pop.mp3', b => popBuf = b); },
    toggle(){ this.init(); on = !on; on ? startAmb() : stopAmb(); return on; },
    setVol(v){ vol = v; localStorage.setItem('union20_vol', Math.round(v * 100)); if (mg) mg.gain.setTargetAtTime(v, ac().currentTime, .05); }, getVol(){ return vol; },
    pop(){ if (!on) return; const c = ac(); if (popBuf) { const s = c.createBufferSource(), g = c.createGain(); s.buffer = popBuf; g.gain.value = .8; s.connect(g).connect(master()); s.start(); } else blop(); }
  };
})();
const sndBtn = document.getElementById('snd');
sndBtn.onclick = e => { const on = Snd.toggle(); sndBtn.textContent = on ? '🔊 사운드 켜짐' : '🔇 사운드 꺼짐'; sndBtn.classList.remove('hint'); e.currentTarget.blur(); };
document.addEventListener('click', e => { if (!e.target.closest('.sndbar') && sndBtn.classList.contains('hint')) sndBtn.click(); }, { once: true });
const volEl = document.getElementById('vol'), volV = document.getElementById('volv');
volEl.value = Math.round(Snd.getVol() * 100); volV.textContent = volEl.value + '%';
volEl.oninput = e => { Snd.setVol(+e.target.value / 100); volV.textContent = e.target.value + '%'; };
volEl.onchange = e => e.target.blur();   // 화면 아무 곳이나 첫 클릭 → 켜짐

setCount(0); tick(); setInterval(tick, POLL_MS);
/* 화면 전환: 마우스 움직이면 탭 표시, 숫자키 1·2 */
(() => {
  let t; const show = () => { document.body.classList.add('navon'); clearTimeout(t); t = setTimeout(() => document.body.classList.remove('navon'), 3000); };
  addEventListener('mousemove', show);
  addEventListener('keydown', e => { if (e.target.tagName === 'INPUT') return;
    const m = { '1': 'monitor.html', '2': 'draw.html' }[e.key]; if (m) location.href = m; });
})();
