<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>출석 현황 | 한국경제TV노조출석부</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root{--ink:#00538E;--ink-deep:#003660;--gold:#1EC2F2;--gold-soft:#8FE3FF;--muted:#8fb0c9;--paper:#fff}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{font-family:Pretendard,-apple-system,"Malgun Gothic",sans-serif;background:var(--ink);color:#fff;overflow:hidden;
       background-image:linear-gradient(#1a8fd0 0%,#0b64a6 30%,#00538E 60%,#022c52 100%)}
  .wrap{height:100%;display:grid;grid-template-columns:1fr 360px;grid-template-rows:auto 1fr;gap:0 48px;padding:40px 56px}
  header{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between}
  .brand{width:380px;height:auto;background:#fff;padding:12px 18px;border-radius:12px;box-sizing:content-box}
  .stage{display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
  .label{font-size:28px;color:var(--gold-soft);font-weight:500;letter-spacing:.02em}
  .count{font-size:min(30vw,340px);line-height:1;font-weight:800;letter-spacing:0;font-variant-numeric:tabular-nums;margin:8px 0 0;vertical-align:bottom}
  .count.bump{animation:bump .45s cubic-bezier(.2,.9,.3,1.4);transform-origin:center}
  @keyframes bump{30%{transform:scale(1.06);color:var(--gold-soft)}}
  .unit{font-size:40px;font-weight:600;color:var(--muted);letter-spacing:0;align-self:flex-end;padding-bottom:1.1em}
  /* 6. 출석 순간 연출 */
  #pop{position:fixed;left:50%;top:42%;transform:translate(-50%,-50%);font-size:200px;font-weight:900;letter-spacing:.06em;color:#fff;
       text-shadow:0 0 40px rgba(30,194,242,.9),0 0 90px rgba(30,194,242,.6);pointer-events:none;opacity:0;z-index:4}
  #pop.go{animation:popin 1.6s cubic-bezier(.2,.9,.3,1) forwards}
  @keyframes popin{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}18%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}60%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,40%) scale(.3)}}
  #pop small{display:block;font-size:28px;font-weight:600;letter-spacing:.1em;color:var(--gold-soft);text-shadow:none;margin-top:-10px}
  /* 7. 숫자 롤업 */
  .count{display:inline-flex;overflow:hidden;height:1.5em;line-height:1.5}
  .digit{display:inline-block;width:.68em;height:1.5em;position:relative}
  .digit .col{position:absolute;left:0;top:0;width:100%;transition:transform .9s cubic-bezier(.2,.8,.2,1)}
  .digit .col span{display:block;height:1.5em;line-height:1.5;text-align:center}
  .countRow{display:flex;align-items:baseline;justify-content:center;gap:14px}
  /* 8. 파티클 */
  #bg{position:fixed;inset:0;z-index:0;pointer-events:none}
  .wrap{position:relative;z-index:1}
  aside{display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:18px}
  .qr{background:#fff;padding:18px;border-radius:20px;width:300px;height:300px;display:grid;place-items:center}
  .qr img,.qr canvas{width:264px!important;height:264px!important;image-rendering:pixelated}
  aside p{margin:0;font-size:20px;line-height:1.5;color:#dfe4f0}
  aside p b{display:block;color:var(--gold-soft);font-size:24px;margin-bottom:4px}
  .status{position:fixed;left:16px;bottom:12px;font-size:13px;color:var(--muted)}
  .status.live::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:#2fbf71;margin-right:6px}
  @media (prefers-reduced-motion:reduce){.count.bump,.chip{animation:none}}
  /* 화면 전환 탭 (빔 운영용) */
  .snav{position:fixed;top:14px;left:50%;transform:translateX(-50%);display:flex;gap:4px;background:rgba(0,0,0,.35);backdrop-filter:blur(8px);
        padding:5px;border-radius:999px;z-index:50;opacity:0;transition:opacity .3s;pointer-events:none}
  body.navon .snav{opacity:1;pointer-events:auto}
  .snav a{color:#fff;text-decoration:none;font-size:14px;font-weight:600;padding:8px 16px;border-radius:999px;opacity:.75}
  .snav a:hover{opacity:1;background:rgba(255,255,255,.12)}
  .snav a.cur{opacity:1;background:var(--gold);color:#fff}
  /* 드래그·선택 방지 */
  body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;cursor:none}
  .snav a{cursor:pointer}
  img{-webkit-user-drag:none;user-drag:none;pointer-events:none}
  input,textarea{-webkit-user-select:text;user-select:text}
</style>
</head>
<body>
<nav class="snav"><a href="monitor.html" class="cur">출석 현황</a><a href="draw.html" class="">경품 추첨</a></nav>
<canvas id="bg"></canvas>
<div id="pop"></div>
<div class="wrap">
  <header>
    <img class="brand" src="logo.png" alt="한국경제TV">
  </header>

  <section class="stage">
    <div class="label">지금까지 출석하신 분</div>
    <div class="countRow"><span class="count" id="count">0</span><span class="unit">명</span></div>
  </section>

  <aside>
    <div class="qr" id="qr"></div>
    <p><b>QR을 찍어 출석해 주세요</b>카메라 또는 카카오톡 스캔</p>
  </aside>
</div>
<div class="status" id="status">연결 중…</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
const SUPABASE_URL = 'https://pmpifokwmrkqrmumycjx.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBtcGlmb2t3bXJrcXJtdW15Y2p4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIxNTQ0ODcsImV4cCI6MjEwNzczMDQ4N30.e4x2eWP33EyTq9_GoAyL9M8WXSzhMKeUdKv6RRLRScY';
const CHECKIN_URL = location.href.replace(/monitor\.html.*$/, 'checkin.html'); // 배포 주소에 맞게 수정 가능
const POLL_MS = 2500, RECENT_N = 8;

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $count = document.getElementById('count'), $status = document.getElementById('status');
let fishLoaded = false;
async function loadAllFish(){ const { data } = await sb.from('attendee_public').select('id,last4').order('checked_in_at'); (data || []).forEach(r => Fish.add(r.id, r.last4, false)); }
new QRCode(document.getElementById('qr'), { text: CHECKIN_URL, width: 264, height: 264, correctLevel: QRCode.CorrectLevel.M });

let last = -1, lastIds = new Set();

async function tick(){
  const { data, error } = await sb.from('attendee_public')
    .select('id,last4,checked_in_at', { count: 'exact' })
    .order('checked_in_at', { ascending: false }).limit(RECENT_N);
  if (!fishLoaded) { fishLoaded = true; loadAllFish(); }
  if (error) { $status.textContent = '연결 오류: ' + error.message; $status.className = 'status'; return; }
  $status.textContent = '실시간 반영 중'; $status.className = 'status live';

  const total = data.length ? await countAll() : 0;
  if (total !== last) {
    setCount(total);
    if (last >= 0) { $count.classList.remove('bump'); void $count.offsetWidth; $count.classList.add('bump'); }
    last = total;
  }
  const ids = data.map(r => r.id).join();
  if (ids !== [...lastIds].join()) {
    if (lastIds.size) { const fresh = data.filter(r => !lastIds.has(r.id)).reverse(); fresh.forEach((r, i) => setTimeout(() => { popIn(r.last4); Fish.add(r.id, r.last4, true); }, i * 700)); }
    lastIds = new Set(data.map(r => r.id));
  }
}
async function countAll(){
  const { count } = await sb.from('attendee_public').select('id', { count: 'exact', head: true });
  return count ?? 0;
}
/* 7. 숫자 롤업 — 자리별 세로 롤러 */
function setCount(n){
  const str = String(n), cur = $count.querySelectorAll('.digit');
  if (cur.length !== str.length) {
    $count.innerHTML = [...str].map(() => `<span class="digit"><span class="col">${Array.from({length:10},(_, i) => `<span>${i}</span>`).join('')}</span></span>`).join('');
  }
  [...str].forEach((d, i) => { const col = $count.querySelectorAll('.digit .col')[i]; col.style.transform = `translateY(-${d * 1.5}em)`; });
}
/* 6. 출석 순간 연출 */
function popIn(l4){ const p = document.getElementById('pop'); p.innerHTML = `${l4 || '????'}<small>출석 완료</small>`; p.classList.remove('go'); void p.offsetWidth; p.classList.add('go'); }
/* 8. 어항: 뒷자리 4개가 물고기처럼 헤엄침 + 거품 */
const Fish = (() => {
  const c = document.getElementById('bg'), x = c.getContext('2d'); let W, H; const F = [], B = []; const seen = new Set();
  // 종류별 설정: 이미지, 가로세로비, 번호 위치(비율), 원래 바라보는 방향, 움직임, 활동 수심(화면 비율), 크기
  const SP = {
    fish:     { src: 'fish.png',     ar: 509 / 753, belly: { x: .63, y: .72 }, faces: 1,  mode: 'swim',  zone: [.08, .85], w: [100, 150], p: 50 },
    turtle:   { src: 'turtle.png',   ar: 279 / 388, belly: { x: .66, y: .42 }, faces: -1, mode: 'swim',  zone: [.1, .8],   w: [120, 160], p: 12 },
    jelly:    { src: 'jelly.png',    ar: 368 / 302, belly: { x: .5, y: .5 },   faces: 0,  mode: 'drift', zone: [.06, .5],  w: [80, 110],  p: 12 },
    seahorse: { src: 'seahorse.png', ar: 445 / 237, belly: { x: .56, y: .5 },  faces: -1, mode: 'hover', zone: [.55, .82], w: [60, 85],   p: 10 },
    octopus:  { src: 'octopus.png',  ar: 304 / 378, belly: { x: .5, y: .17 },  faces: 0,  mode: 'walk',  zone: [1, 1],     w: [110, 140], p: 8 },
    crab:     { src: 'crab.png',     ar: 288 / 366, belly: { x: .5, y: .33 },  faces: 0,  mode: 'walk',  zone: [1, 1],     w: [100, 130], p: 8 },
  };
  const HUES = [0, -22, 22];                                                                 // 색 변형 3종, 미리 렌더링해서 재사용
  for (const k in SP) { const s = SP[k]; s.img = new Image(); s.img.src = s.src; s.v = [];
    s.img.onload = () => { const bw = 320, bh = Math.round(bw * s.ar);
      s.v = HUES.map(h => { const o = document.createElement('canvas'); o.width = bw; o.height = bh; const g = o.getContext('2d');
        if (h) g.filter = `hue-rotate(${h}deg)`; g.drawImage(s.img, 0, 0, bw, bh); return o; }); }; }
  const pick = () => { let r = Math.random() * 100; for (const k in SP) { r -= SP[k].p; if (r <= 0) return k; } return 'fish'; };
  const FLOOR = 70; const M = { x: -9999, y: -9999, t: 0 };
  addEventListener('mousemove', e => { M.x = e.clientX; M.y = e.clientY; M.t = performance.now(); });
  addEventListener('mouseleave', () => { M.x = M.y = -9999; });
  const size = () => { W = c.width = innerWidth; H = c.height = innerHeight; }; size();
  let rzT; addEventListener('resize', () => { clearTimeout(rzT); rzT = setTimeout(() => { const ow = W, oh = H; size();
    for (const f of F) { f.x = f.x / ow * W; f.y = f.y / oh * H; f.ty = f.ty / oh * H; if (SP[f.k].mode === 'walk') f.ty = H - FLOOR - f.h * .35; }
    for (const b of B) { b.x = b.x / ow * W; b.y = b.y / oh * H; } }, 150); });
  for (let i = 0; i < 45; i++) B.push({ x: Math.random() * innerWidth, y: Math.random() * innerHeight, r: 1.5 + Math.random() * 5, v: .25 + Math.random() * .6, a: Math.random() * 7 });
  const zones = () => [{ x: W * .37, y: H * .5, rx: W * .27, ry: H * .38 }, { x: W * .85, y: H * .52, rx: W * .14, ry: H * .3 }];   // 카운트·QR 영역은 비켜 다님
  const inZone = (px, py) => zones().some(z => ((px - z.x) / z.rx) ** 2 + ((py - z.y) / z.ry) ** 2 < 1);
  function add(id, l4, fresh){
    if (seen.has(id)) return; seen.add(id);
    const k = pick(), s = SP[k], w = s.w[0] + Math.random() * (s.w[1] - s.w[0]), h = w * s.ar;
    let px = Math.random() * W, py = s.mode === 'walk' ? H - FLOOR - h * .35 : H * (s.zone[0] + Math.random() * (s.zone[1] - s.zone[0]));
    for (let i = 0; i < 20 && s.mode !== 'walk' && inZone(px, py); i++) { px = Math.random() * W; py = H * (s.zone[0] + Math.random() * (s.zone[1] - s.zone[0])); }
    const spd = s.mode === 'swim' ? .35 + Math.random() * .6 : s.mode === 'walk' ? .15 + Math.random() * .25 : .08 + Math.random() * .15;
    F.push({ id, k, t: l4 || '????', w, h, x: fresh ? W * .5 : px, y: fresh ? H * .42 : py, ty: py,
             vx: (Math.random() < .5 ? -1 : 1) * spd, vy: 0, spd, ph: Math.random() * 7, face: 0, tvx: 0, hue: Math.random() < .5 ? 0 : 1 + (Math.random() * 2 | 0), born: fresh ? performance.now() : 0 });
  }
  const weeds = Array.from({length: 14}, (_, i) => ({ x: (i + .5) / 14, h: 90 + Math.random() * 120, ph: Math.random() * 7, w: 8 + Math.random() * 8 }));
  function sea(now){
    for (let i = 0; i < 6; i++) { const cx = W * (.1 + i * .16) + Math.sin(now / 4000 + i) * 60, sw = 120 + i * 20;
      const g = x.createLinearGradient(0, 0, 0, H * .8); g.addColorStop(0, 'rgba(180,230,255,.14)'); g.addColorStop(1, 'rgba(180,230,255,0)');
      x.fillStyle = g; x.beginPath(); x.moveTo(cx - sw * .3, 0); x.lineTo(cx + sw * .3, 0); x.lineTo(cx + sw + 80, H * .8); x.lineTo(cx - sw + 80, H * .8); x.closePath(); x.fill(); }
    const sg = x.createLinearGradient(0, H - FLOOR, 0, H); sg.addColorStop(0, 'rgba(0,20,45,0)'); sg.addColorStop(1, 'rgba(0,12,30,.9)');
    x.fillStyle = sg; x.fillRect(0, H - FLOOR, W, FLOOR);
    for (const s of weeds) { const bx = s.x * W, sway = Math.sin(now / 1600 + s.ph) * 18;
      x.beginPath(); x.moveTo(bx, H); x.bezierCurveTo(bx - 10, H - s.h * .4, bx + sway, H - s.h * .7, bx + sway * 1.4, H - s.h);
      x.lineWidth = s.w; x.lineCap = 'round'; x.strokeStyle = 'rgba(2,40,60,.75)'; x.stroke();
      x.beginPath(); x.moveTo(bx + 18, H); x.bezierCurveTo(bx + 14, H - s.h * .3, bx + 18 - sway, H - s.h * .5, bx + 18 - sway * 1.2, H - s.h * .7);
      x.lineWidth = s.w * .6; x.strokeStyle = 'rgba(0,55,75,.6)'; x.stroke(); }
  }
  function frame(now){
    x.clearRect(0, 0, W, H); sea(now);
    for (const b of B) { b.y -= b.v; b.x += Math.sin(b.a += .02) * .3; if (b.y < -5) { b.y = H + 5; b.x = Math.random() * W; }
      x.beginPath(); x.arc(b.x, b.y, b.r, 0, 7); x.strokeStyle = 'rgba(200,240,255,.45)'; x.lineWidth = 1.2; x.stroke(); x.beginPath(); x.arc(b.x - b.r * .3, b.y - b.r * .3, b.r * .3, 0, 7); x.fillStyle = 'rgba(255,255,255,.5)'; x.fill(); }
    const zs = zones(); const mouseOn = now - M.t < 2500;        // 마우스가 멈춘 지 2.5초 지나면 무시
    // 바닥 생물이 앞에 오도록 정렬
    F.sort((a, b) => (SP[a.k].mode === 'walk') - (SP[b.k].mode === 'walk'));
    for (const f of F) {
      const s = SP[f.k]; f.ph += .035;
      if (mouseOn) {                                            // 마우스 가까이 오면 놀라서 달아남
        const dx = f.x - (hk.init ? hk.x : M.x), dy = f.y - (hk.init ? hk.y : M.y), d2 = dx * dx + dy * dy, R = 220;
        if (d2 < R * R) { const d = Math.sqrt(d2) || 1, k = (1 - d / R) * .9;
          if (s.mode === 'walk') { f.vx += (dx / d) * k * 1.2; f.tvx = 0; }
          else { f.vx += (dx / d) * k; if (s.mode === 'swim') f.vy += (dy / d) * k; else f.ty += (dy / d) * k * 6; f.tvx = 0; } }
      }
      if (s.mode === 'swim') {
        f.x += f.vx; f.y += Math.sin(f.ph) * .45 + f.vy;
        for (const z of zs) { const dx = (f.x - z.x) / z.rx, dy = (f.y - z.y) / z.ry; if (dx * dx + dy * dy < 1) { f.vy += dy * .09; f.vx += dx * .05; } }
        f.vy *= .96; f.vx = Math.max(-1.3, Math.min(1.3, f.vx));
        if (Math.random() < .003) f.tvx = -Math.sign(f.vx) * f.spd;
        const lo = H * s.zone[0], hi = H * s.zone[1]; if (f.y < lo) f.vy += .05; if (f.y > hi) f.vy -= .05;
      } else if (s.mode === 'drift') {                        // 해파리: 위아래로 둥실, 느리게 좌우
        f.x += f.vx * .6; f.y = f.ty + Math.sin(f.ph * .9) * 28; if (Math.random() < .002) f.tvx = -Math.sign(f.vx) * f.spd;
        f.ty += (Math.random() - .5) * .3; f.ty = Math.max(H * s.zone[0], Math.min(H * s.zone[1], f.ty));
        if (inZone(f.x, f.ty)) f.ty -= .8;
      } else if (s.mode === 'hover') {                        // 해마: 낮은 곳에서 살랑살랑
        f.x += f.vx * .5; f.ty = Math.max(H * s.zone[0], Math.min(H * s.zone[1], f.ty)); f.y = f.ty + Math.sin(f.ph * 1.3) * 10; if (Math.random() < .003) f.tvx = -Math.sign(f.vx) * f.spd;
      } else {                                                 // 문어·꽃게: 바닥을 기어다님
        f.x += f.vx; f.y = f.ty + Math.abs(Math.sin(f.ph * (f.k === 'crab' ? 4 : 1.2))) * (f.k === 'crab' ? 3 : 6);
        if (Math.random() < .006) f.tvx = -Math.sign(f.vx) * f.spd;
        if (Math.random() < .004) f.vx = 0, f.tvx = (Math.random() < .5 ? -1 : 1) * f.spd;   // 가끔 멈칫
      }
      if (f.tvx) { f.vx += (f.tvx - f.vx) * .04; if (Math.abs(f.tvx - f.vx) < .02) f.tvx = 0; }
      else if (Math.abs(f.vx) > f.spd * 1.05) f.vx *= .985;                                    // 놀란 뒤 제 속도로 복귀
      if (s.mode === 'walk') f.vx = Math.max(-2.2, Math.min(2.2, f.vx)); else if (s.mode !== 'swim') f.vx = Math.max(-1.5, Math.min(1.5, f.vx));
      if (f.x < -f.w) f.x = W + f.w; if (f.x > W + f.w) f.x = -f.w;
      let dir = 1;
      if (s.faces) { const want = (f.vx < 0 ? -1 : 1) * s.faces; f.face += (want - f.face) * .12; dir = f.face; }
      const age = f.born ? Math.min(1, (now - f.born) / 1200) : 1, sc = f.born ? 1 + (1 - age) * 1.6 : 1, alpha = .5 + .5 * age;
      const w = f.w * sc, h = f.h * sc, tilt = s.mode === 'swim' ? Math.sin(f.ph) * .06 * Math.sign(f.vx || 1) : s.mode === 'drift' ? Math.sin(f.ph * .7) * .08 : 0;
      x.save(); x.translate(f.x, f.y); x.rotate(tilt); x.globalAlpha = alpha;
      const sx = s.faces ? (Math.abs(dir) < .08 ? .08 * Math.sign(dir || 1) : dir) : 1;
      if (s.v.length) { x.save(); x.scale(sx, 1); x.drawImage(s.v[f.hue], -w / 2, -h / 2, w, h); x.restore(); }
      const bx = (s.belly.x - .5) * w * sx, by = (s.belly.y - .5) * h;
      x.globalAlpha = alpha * (s.faces ? Math.min(1, Math.abs(dir) * 2.5) : 1);
      x.font = `800 ${Math.round(Math.min(w, h) * .17)}px Pretendard, sans-serif`; x.textAlign = 'center'; x.textBaseline = 'middle';
      x.lineWidth = Math.max(2, w * .02); x.strokeStyle = 'rgba(255,255,255,.9)'; x.strokeText(f.t, bx, by);
      x.fillStyle = '#1b2a4a'; x.fillText(f.t, bx, by); x.restore();
    }
    hook(now, mouseOn);
    requestAnimationFrame(frame);
  }
  /* 커서 = 낚싯바늘 (줄은 로프 물리, 바늘은 관성으로 따라옴) */
  let hookA = 0; const hk = { x: 0, y: 0, vx: 0, vy: 0, init: false }; const N = 16; let rope = null;
  function hook(now, on){
    hookA += ((on && M.x > 0) ? 1 : 0) - hookA > 0 ? .08 : -.05; hookA = Math.max(0, Math.min(1, hookA));
    if (hookA <= 0) { hk.init = false; return; }
    if (!hk.init) { hk.x = M.x; hk.y = M.y; hk.vx = hk.vy = 0; hk.init = true; rope = Array.from({length: N + 1}, (_, i) => ({ x: M.x, y: M.y * i / N, px: M.x, py: M.y * i / N })); }
    // 바늘: 마우스를 스프링으로 따라감 (물속이라 묵직하게)
    hk.vx += (M.x - hk.x) * .06; hk.vy += (M.y - hk.y) * .06; hk.vx *= .82; hk.vy *= .82; hk.x += hk.vx; hk.y += hk.vy;
    // 줄: verlet 로프, 위쪽 끝은 마우스 x 위 화면 밖, 아래 끝은 바늘
    const ax = M.x, ay = -10, seg = Math.max(8, Math.hypot(hk.x - ax, hk.y - ay) / N);
    for (let i = 1; i < N; i++) { const p = rope[i], vx = (p.x - p.px) * .96, vy = (p.y - p.py) * .96; p.px = p.x; p.py = p.y; p.x += vx; p.y += vy + .25; }
    rope[0].x = ax; rope[0].y = ay; rope[N].x = hk.x; rope[N].y = hk.y - 14;
    for (let k = 0; k < 6; k++) for (let i = 0; i < N; i++) {
      const a = rope[i], b = rope[i + 1]; let dx = b.x - a.x, dy = b.y - a.y; const d = Math.hypot(dx, dy) || 1, diff = (d - seg) / d * .5;
      if (i !== 0) { a.x += dx * diff; a.y += dy * diff; } if (i + 1 !== N) { b.x -= dx * diff; b.y -= dy * diff; }
    }
    x.save(); x.globalAlpha = hookA;
    x.strokeStyle = 'rgba(255,255,255,.6)'; x.lineWidth = 1.5; x.lineJoin = 'round'; x.beginPath(); x.moveTo(rope[0].x, rope[0].y);
    for (let i = 1; i <= N; i++) { const p = rope[i - 1], q = rope[i]; x.quadraticCurveTo(p.x, p.y, (p.x + q.x) / 2, (p.y + q.y) / 2); } x.lineTo(rope[N].x, rope[N].y); x.stroke();
    // 바늘: 움직이는 방향으로 기울고, 멈추면 살짝 흔들림
    const tilt = Math.max(-.5, Math.min(.5, hk.vx * .04)) + Math.sin(now / 700) * .04;
    x.translate(hk.x, hk.y); x.rotate(tilt);
    x.lineWidth = 5; x.lineCap = 'round'; x.strokeStyle = '#e9eef5';
    x.beginPath(); x.moveTo(0, -12); x.lineTo(0, 18); x.arc(-10, 18, 10, 0, Math.PI, false); x.lineTo(-20, 6); x.stroke();
    x.beginPath(); x.moveTo(-20, 6); x.lineTo(-25, 12); x.stroke();
    x.fillStyle = '#e9eef5'; x.beginPath(); x.arc(0, -12, 4, 0, 7); x.fill();
    x.fillStyle = '#ff6b6b'; x.beginPath(); x.ellipse(-3, 4, 7, 5, .4, 0, 7); x.fill();
    x.restore();
  }
  requestAnimationFrame(frame);
  return { add };
})();

setCount(0); tick(); setInterval(tick, POLL_MS);
/* 화면 전환: 마우스 움직이면 탭 표시, 숫자키 1·2 */
(() => {
  let t; const show = () => { document.body.classList.add('navon'); clearTimeout(t); t = setTimeout(() => document.body.classList.remove('navon'), 3000); };
  addEventListener('mousemove', show);
  addEventListener('keydown', e => { if (e.target.tagName === 'INPUT') return;
    const m = { '1': 'monitor.html', '2': 'draw.html' }[e.key]; if (m) location.href = m; });
})();
</script>
